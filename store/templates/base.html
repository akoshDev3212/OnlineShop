{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shop{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        *{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--main:#ff6b00;
--main-hover:#ff8124;
--bg:#f6f7fb;
--text:#1f2937;
--border:#ececec;
}

body{
font-family:'Poppins',sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

/* NAVBAR */

.main-navbar{
position:sticky;
top:0;
z-index:9999;

display:flex;
align-items:center;
gap:12px;

padding:12px;

background:rgba(255,255,255,.95);

backdrop-filter:blur(20px);

box-shadow:
0 4px 20px rgba(0,0,0,.06);
}

/* LOGO */

.logo{
flex-shrink:0;
}

.logo img{
height:42px;
display:block;
}

/* SEARCH */

.search-container{
flex:1;
display:flex;
align-items:center;
gap:10px;
}

.catalog-btn{
height:42px;
padding:0 14px;

border:none;
border-radius:12px;

background:var(--main);

color:#fff;

font-weight:700;

display:flex;
align-items:center;
gap:6px;

cursor:pointer;
}

.search-box{
flex:1;
position:relative;
}

.search-box input{
width:100%;
height:42px;

padding:0 45px 0 15px;

border:1px solid #ddd;

border-radius:12px;

background:#fff;

outline:none;

font-size:14px;
}

.search-box input:focus{
border-color:var(--main);
}

.search-box button{
position:absolute;

right:5px;
top:5px;

width:32px;
height:32px;

border:none;

border-radius:8px;

background:var(--main);

color:#fff;

cursor:pointer;
}

/* ICONS */

.nav-icons{
display:flex;
align-items:center;
gap:10px;
}

.nav-icons a{
width:42px;
height:42px;

border-radius:12px;

background:#fff;

display:flex;
align-items:center;
justify-content:center;

text-decoration:none;

color:#333;

font-size:20px;

box-shadow:
0 2px 10px rgba(0,0,0,.08);

transition:.3s;
}

.nav-icons a:hover{
transform:translateY(-2px);
}

.nav-icons span{
display:none;
}

/* DROPDOWN */

.catalog-dropdown{
position:absolute;

top:65px;
left:12px;

width:240px;

background:#fff;

border-radius:18px;

overflow:hidden;

display:none;

box-shadow:
0 15px 35px rgba(0,0,0,.12);
}

.catalog-dropdown.show{
display:block;
}

.catalog-dropdown a{
display:block;

padding:14px 18px;

text-decoration:none;

color:#333;

border-bottom:1px solid #f3f3f3;
}

.catalog-dropdown a:hover

/* MOBILE */

@media(max-width:768px){

.main-navbar{
padding:10px;
gap:8px;
}

.logo img{
height:34px;
}

.catalog-btn{
width:42px;
padding:0;
justify-content:center;
}

.catalog-btn span{
display:none;
}

.search-box input{
height:40px;
font-size:13px;
}

.nav-icons{
gap:6px;
}

.nav-icons a{
width:38px;
height:38px;
font-size:18px;
}
}

/* TELEGRAM MINI APP */

@media(max-width:480px){

.main-navbar{
display:grid;

grid-template-columns:
auto
1fr
auto;

gap:8px;
}

.search-container{
grid-column:1/4;
order:2;
}

.catalog-dropdown{
left:10px;
right:10px;
width:auto;
}

.logo img{
height:32px;
}

.nav-icons a{
width:36px;
height:36px;
font-size:17px;
}

.search-box input{
height:38px;
}

.catalog-btn{
height:38px;
}
}

    </style>
</head>
<body>

<div class="main-navbar">
    <div class="logo">
        <a href="{% url 'store:store' %}"><img src="{% static 'img/shop_logo.png' %}" alt="Logo"></a>
    </div>

    <div class="search-container">
        <button class="catalog-btn" id="catalogBtn"><i class="ri-menu-line"></i> <span>Katalog</span></button>
        <div class="catalog-dropdown" id="catalogDropdown">
            {% for category in categories %}
                <a href="{% url 'store:category_products' category.id %}">{{ category.title }}</a>
            {% endfor %}
        </div>
        <form class="search-box" method="get" action="{% url 'store:search_result' %}">
            <input type="text" name="search" placeholder="Qidirish...">
            <button type="submit"><i class="ri-search-line"></i></button>
        </form>
    </div>

    <div class="nav-icons">
        {% if user.is_authenticated %}
            <a href="{% url 'users:sign_out' %}"><i class="ri-logout-box-line"></i><span>Chiqish</span></a>
        {% else %}
            <a href="{% url 'users:sign_in' %}"><i class="ri-user-line"></i><span>Kirish</span></a>
        {% endif %}
        <a href="{% url 'store:favorites' %}"><i class="ri-heart-line"></i><span>Sevimlilar</span></a>
        <a href="{% url 'store:cart' %}"><i class="ri-shopping-cart-line"></i><span>Savat</span></a>
    </div>
</div>

{% block content %}{% endblock %}

<script>
    const catalogBtn = document.getElementById('catalogBtn');
    const catalogDropdown = document.getElementById('catalogDropdown');
    catalogBtn.addEventListener('click', (e) => { e.stopPropagation(); catalogDropdown.classList.toggle('show'); });
    document.addEventListener('click', () => catalogDropdown.classList.remove('show'));
</script>
</body>
</html>
