{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
  body {
    background-color: #f8f9fa;
    font-family: 'Poppins', sans-serif;
  }

  .shops-container {
    width: 90%;
    max-width: 1300px;
    margin: 40px auto;
  }

  .shops-title {
    text-align: center;
    font-size: 36px;
    font-weight: 700;
    color: #333;
    margin-bottom: 30px;
  }

  .shops-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 25px;
  }

  .shop-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    overflow: hidden;
    transition: 0.3s;
  }

  .shop-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  }

  .shop-image img {
    width: 100%;
    height: 220px;
    object-fit: cover;
  }

  .shop-content {
    padding: 20px;
  }

  .shop-name {
    font-size: 20px;
    font-weight: 600;
    color: #222;
    margin-bottom: 10px;
  }

  .shop-address, .shop-phone, .shop-worktime {
    font-size: 15px;
    color: #555;
    margin-bottom: 5px;
  }

  .shop-icon {
    color: #ffcc00;
    margin-right: 6px;
  }

  @media (max-width: 500px) {
    .shop-name { font-size: 18px; }
  }
</style>

<div class="shops-container">
  <h1 class="shops-title">🏬 Do‘konlarimiz</h1>

  <div class="shops-grid">
    {% for shop in shops %}
    <div class="shop-card">
      <div class="shop-image">
        <img src="{{ shop.image.url }}" alt="{{ shop.name }}">
      </div>
      <div class="shop-content">
        <div class="shop-name">{{ shop.name }}</div>
        <div class="shop-address"><i class="shop-icon">📍</i>{{ shop.address }}</div>
        <div class="shop-phone"><i class="shop-icon">📞</i>{{ shop.phone }}</div>
        <div class="shop-worktime"><i class="shop-icon">⏰</i>{{ shop.work_time }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
