{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
body{
font-family:'Poppins',sans-serif;
background:#f6f7fb;
margin:0;
}

.container{
max-width:1400px;
margin:20px auto;
padding:0 12px;
}

h2{
font-size:28px;
font-weight:800;
margin-bottom:20px;
color:#111827;
}

/* GRID */

.fav-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

/* CARD */

.card{
background:#fff;
border-radius:18px;
overflow:hidden;
position:relative;
box-shadow:0 4px 16px rgba(0,0,0,.06);
transition:.3s;
}

.card:hover{
transform:translateY(-4px);
}

.card img{
width:100%;
height:150px;
object-fit:contain;
padding:10px;
background:#fff;
}

/* DELETE */

.delete-btn{
position:absolute;
top:10px;
right:10px;

width:34px;
height:34px;

display:flex;
align-items:center;
justify-content:center;

background:#ff4d6d;
color:#fff;

border-radius:50%;

font-size:18px;
font-weight:700;

text-decoration:none;

z-index:5;
}

.delete-btn:hover{
transform:scale(1.08);
}

/* INFO */

.card-title{
padding:0 12px;
margin-top:5px;

font-size:14px;
font-weight:700;
color:#111827;

display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;

min-height:40px;
}

.card-price{
padding:0 12px;
margin-top:6px;

font-size:18px;
font-weight:800;

color:#ff6b00;
}

/* BUTTON */

.cart-btn{
width:calc(100% - 24px);

margin:12px;

height:42px;

border:none;
border-radius:12px;

background:#ff6b00;
color:white;

font-size:13px;
font-weight:700;

cursor:pointer;

transition:.3s;
}

.cart-btn:hover{
background:#ff8124;
}

/* EMPTY */

.empty{
background:#fff;
padding:60px 20px;
border-radius:20px;
text-align:center;
font-size:18px;
color:#6b7280;
}

/* TABLET */

@media(max-width:768px){

.fav-grid{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.card img{
height:130px;
}

.card-title{
font-size:13px;
}

.card-price{
font-size:16px;
}
}

/* DESKTOP */

@media(min-width:992px){

.fav-grid{
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card img{
height:220px;
}

.card-title{
font-size:17px;
}

.card-price{
font-size:22px;
}

.cart-btn{
height:46px;
font-size:14px;
}
}
</style>


<div class="container">
  <h2>🧡 Sevimlilar</h2>

  {% if favorites %}
  <div class="fav-grid">

    {% for fav in favorites %}
    <div class="card">


      <a href="{% url 'store:remove_favorite' fav.id %}" class="delete-btn">×</a>


      <a href="{% url 'store:products_detail' fav.product.id %}">
        <img src="{{ fav.product.image.url }}" alt="">
      </a>

      <div class="card-title">{{ fav.product.title }}</div>
      <div class="card-price">{{ fav.product.price }} so‘m</div>



      <a href="{% url 'store:store' %}?product={{ fav.product.id }}">
        <button class="cart-btn">🛒 Savatga qo‘shish</button>
      </a>

    </div>
    {% endfor %}

  </div>

  {% else %}
  <div class="empty">
    <p>Sevimlilar bo‘sh 😢</p>
  </div>
  {% endif %}
</div>

{% endblock %}
