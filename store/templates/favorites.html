{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
body {
  font-family:'Poppins', sans-serif;
  background:#f5f6fa;
  margin:0;
}

.container {
  max-width:1300px;
  margin:40px auto;
  padding:0 15px;
}

h2 {
  font-weight:700;
  margin-bottom:30px;
  color:#333;
}

/* GRID 5 TA */
.fav-grid {
  display:grid;
  grid-template-columns: repeat(5, 1fr);
  gap:22px;
}

/* CARD STYLE */
.card {
  background:#fff;
  border-radius:20px;
  box-shadow:0 6px 25px rgba(0,0,0,0.08);
  padding:12px;
  transition:0.3s ease;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.card:hover {
  transform:translateY(-6px);
  box-shadow:0 10px 30px rgba(0,0,0,0.18);
}

.card img {
  width:100%;
  height:160px;
  border-radius:14px;
  object-fit:cover;
  border:1px solid #e5e5e5;
}

/* DELETE BUTTON – ALWAYS VISIBLE */
.delete-btn {
  position:absolute;
  top:10px;
  right:10px;
  background:#ff4d6d;
  color:#fff;
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:18px;
  font-weight:700;
  text-decoration:none;
  transition:0.25s;
  box-shadow:0 4px 10px rgba(255,0,60,0.35);
}

.delete-btn:hover {
  background:#ff6f87;
  transform:scale(1.1);
}

.card-title {
  font-weight:600;
  margin-top:12px;
  font-size:15px;
  color:#333;
  text-align:center;
  min-height:38px;
}

.card-price {
  color:#ec407a;
  font-weight:700;
  font-size:16px;
  text-align:center;
  margin:8px 0;
}

/* CART ADD BUTTON */
.cart-btn {
  background:#4CAF50;
  border:none;
  color:white;
  padding:10px 15px;
  width:100%;
  border-radius:10px;
  font-size:14px;
  cursor:pointer;
  transition:0.3s;
  font-weight:500;
  margin-top:8px;
}

.cart-btn:hover {
  background:#6cd36b;
  transform:scale(1.02);
}

.empty {
  text-align:center;
  padding:100px 0;
  color:#777;
  font-size:18px;
}
</style>


<div class="container">
  <h2>🧡 Sevimlilar</h2>

  {% if favorites %}
  <div class="fav-grid">

    {% for fav in favorites %}
    <div class="card">


      <a href="{% url 'store:remove_favorite' fav.id %}" class="delete-btn">×</a>


      <a href="{% url 'store:products_detail' fav.product.id %}">
        <img src="{{ fav.product.image.url }}" alt="">
      </a>

      <div class="card-title">{{ fav.product.title }}</div>
      <div class="card-price">{{ fav.product.price }} so‘m</div>



      <a href="{% url 'store:store' %}?product={{ fav.product.id }}">
        <button class="cart-btn">🛒 Savatga qo‘shish</button>
      </a>

    </div>
    {% endfor %}

  </div>

  {% else %}
  <div class="empty">
    <p>Sevimlilar bo‘sh 😢</p>
  </div>
  {% endif %}
</div>

{% endblock %}
