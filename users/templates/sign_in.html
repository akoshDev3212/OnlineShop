{% extends 'base.html' %}
{% load static %}
{% block content %}

<style>
/* === Background === */
body {
  background: linear-gradient(135deg, #f8f9fb, #eef1f4);
  font-family: 'Poppins', sans-serif;
}

/* === Center Wrapper === */
.login-wrapper {
  width: 100%;
  min-height: 88vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

/* === Big Card === */
.login-card {
  width: 520px;
  background: #ffffff;
  border-radius: 22px;
  padding: 40px 45px;
  box-shadow: 0 15px 38px rgba(0, 0, 0, 0.12);
  transition: 0.3s ease-in-out;
  border: 1px solid #f1f1f1;
}

.login-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
}

/* === Title === */
.login-title {
  font-weight: 700;
  font-size: 30px;
  text-align: center;
  color: #252525;
  margin-bottom: 22px;
}

/* === Inputs === */
.site-form input {
  width: 100%;
  padding: 15px 18px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid #dbdbdb;
  outline: none;
  transition: 0.25s ease;
  background: #fafafa;
}

.site-form input:focus {
  border-color: #ff8c00;
  background: #fff;
  box-shadow: 0 0 6px rgba(255, 140, 0, 0.4);
}

/* === Submit Button === */
.btn-submit {
  width: 100%;
  background: #ff8c00;
  border: none;
  padding: 14px;
  font-size: 17px;
  font-weight: 600;
  border-radius: 12px;
  transition: 0.28s ease;
  color: white;
  margin-top: 6px;
}

.btn-submit:hover {
  background: #ffa94d;
  transform: translateY(-2px);
}

/* === Bottom Text === */
.signup-text {
  text-align: center;
  margin-top: 22px;
  font-size: 15px;
}

.signup-text a {
  color: #ff8c00;
  font-weight: 600;
  text-decoration: none;
}

.signup-text a:hover {
  text-decoration: underline;
}
</style>

<div class="login-wrapper">
  <div class="login-card">
      
    <h2 class="login-title">🔐 Akkauntga kirish</h2>

    <form method="post" class="site-form">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="fw-semibold" style="font-size: 14px;">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div class="text-danger small">{{ field.errors }}</div>
        {% endif %}
      </div>
      {% endfor %}
      
      <button type="submit" class="btn-submit">Kirish</button>
    </form>

    <p class="signup-text">Akkount yo‘qmi?
      <a href="{% url 'users:sign_up' %}">Ro‘yxatdan o‘ting</a>
    </p>

  </div>
</div>

{% endblock content %}
